name: engineering-verification

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run shared verification
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            ./eng/verify.ps1 -Profile Main
          }
          else {
            ./eng/verify.ps1 -Profile Pr
          }
