trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Use .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - task: PowerShell@2
    displayName: Run shared verification
    inputs:
      pwsh: true
      targetType: inline
      script: ./eng/verify.ps1 -Profile Pr
